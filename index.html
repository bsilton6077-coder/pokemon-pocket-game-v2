<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Pocket</title>
    <style>
      :root {
        --bg-1: #07111f;
        --bg-2: #12263d;
        --panel: rgba(17, 24, 39, 0.85);
        --panel-strong: rgba(15, 23, 42, 0.95);
        --card-bg: #f8fafc;
        --text: #edf6ff;
        --muted: #a7bdd9;
        --gold: #f9c74f;
        --green: #34d399;
        --red: #ef4444;
        --blue: #60a5fa;
        --purple: #a78bfa;
        --pink: #f9a8d4;
        --shadow: rgba(2, 6, 23, 0.7);
        --common: #dfe7f9;
        --rare: #93c5fd;
        --epic: #c4b5fd;
        --legendary: #f9a8d4;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1a2d4d, var(--bg-1) 45%, #030b14 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 26px;
      }

      .app {
        width: min(1200px, 100%);
        background: rgba(8, 15, 27, 0.78);
        border: 1px solid rgba(160, 174, 192, 0.2);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 25px 80px rgba(2, 6, 23, 0.8);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 20px 24px 18px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.5));
        flex-wrap: wrap;
      }

      .title-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .pokeball {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #ffffff 0%, #edf2ff 18%, #e2e8f0 20%, #d8e3f3 100%);
        box-shadow: inset 0 -8px 0 rgba(15, 23, 42, 0.08), 0 8px 18px rgba(15, 23, 42, 0.4);
        position: relative;
      }

      .pokeball::before,
      .pokeball::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 50%;
      }

      .pokeball::before {
        top: 0;
        background: linear-gradient(180deg, #ef4444, #dc2626);
        border-radius: 50% 50% 0 0;
      }

      .pokeball::after {
        bottom: 0;
        background: linear-gradient(180deg, #e2e8f0, #cbd5e1);
        border-radius: 0 0 50% 50%;
      }

      .pokeball .middle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: white;
        border: 4px solid #0f172a;
        transform: translate(-50%, -50%);
        z-index: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.8rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .currency-wrap {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 800;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .chip .icon {
        font-size: 1.1rem;
      }

      .content {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 20px;
        padding: 22px 24px 24px;
      }

      .panel {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 22px;
        padding: 18px;
      }

      .main-panel {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 12px;
      }

      .stat {
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 14px;
        padding: 12px 14px;
      }

      .stat-label {
        display: block;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
        margin-bottom: 7px;
      }

      .stat-value {
        font-size: clamp(1.2rem, 2vw, 1.8rem);
        font-weight: 800;
      }

      .progress-wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.82rem;
      }

      .progress-bar {
        position: relative;
        width: 100%;
        height: 18px;
        background: rgba(148, 163, 184, 0.12);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.14);
      }

      .progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(90deg, #facc15, #34d399);
        border-radius: inherit;
        transition: width 0.25s ease;
      }

      .pack-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 800;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .primary {
        background: linear-gradient(135deg, #f59e0b, #ef4444);
        color: white;
        box-shadow: 0 12px 24px rgba(239, 68, 68, 0.25);
      }

      .secondary {
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      .pack-results {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 14px;
      }

      .pack-card {
        position: relative;
        min-height: 238px;
        background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(226,232,240,0.86));
        border-radius: 18px;
        border: 3px solid rgba(15, 23, 42, 0.18);
        padding: 12px 10px 10px;
        box-shadow: 0 18px 30px rgba(15, 23, 42, 0.18);
        overflow: hidden;
        animation: popIn 0.25s ease;
      }

      .pack-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent 60%);
      }

      .card-rarity-tag {
        position: relative;
        z-index: 1;
        display: inline-block;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card-art {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        max-width: 120px;
        aspect-ratio: 1;
        object-fit: contain;
        margin: 10px auto 8px;
        filter: drop-shadow(0 10px 18px rgba(15, 23, 42, 0.18));
      }

      .card-name {
        position: relative;
        z-index: 1;
        text-align: center;
        font-size: 1.08rem;
        font-weight: 800;
        margin-bottom: 6px;
        color: #111827;
      }

      .card-type {
        position: relative;
        z-index: 1;
        text-align: center;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(17,24,39,0.74);
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .shop-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .shop-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 14px;
        padding: 12px 14px;
      }

      .shop-name {
        font-weight: 800;
      }

      .shop-desc {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .shop-cost {
        color: var(--gold);
        font-weight: 800;
      }

      .binder-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 10px;
      }

      .binder-card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.1);
        border-radius: 12px;
        padding: 10px 8px;
        text-align: center;
        opacity: 0.5;
        transition: opacity 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      }

      .binder-card.owned {
        opacity: 1;
        border-color: rgba(251, 191, 36, 0.8);
        transform: translateY(-2px);
      }

      .mini-art {
        width: 100%;
        max-width: 56px;
        aspect-ratio: 1;
        object-fit: contain;
        display: block;
        margin: 0 auto 8px;
      }

      .mini-name {
        font-size: 0.8rem;
        font-weight: 800;
        margin-bottom: 5px;
      }

      .mini-count {
        font-size: 0.72rem;
        color: var(--gold);
        font-weight: 800;
      }

      .toast {
        min-height: 26px;
        color: #fef3c7;
        font-weight: 700;
      }

      @keyframes popIn {
        0% { opacity: 0; transform: translateY(12px) scale(0.95); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @media (max-width: 900px) {
        .content { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px) {
        .pack-results { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
        .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="title-wrap">
          <div class="pokeball" aria-hidden="true"><span class="middle"></span></div>
          <h1>Pokémon Pocket</h1>
        </div>

        <div class="currency-wrap">
          <div class="chip"><span class="icon">💰</span><span id="coinsDisplay">25</span></div>
          <div class="chip"><span class="icon">🎴</span><span id="packsDisplay">0</span></div>
        </div>
      </div>

      <div class="content">
        <div class="panel main-panel">
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Collection</span>
              <span id="collectionStat" class="stat-value">0/0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Unique</span>
              <span id="uniqueStat" class="stat-value">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Duplicates</span>
              <span id="duplicateStat" class="stat-value">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Packs</span>
              <span id="packStat" class="stat-value">0</span>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-header">
              <span>Binder completion</span>
              <span id="completionPercent">0%</span>
            </div>
            <div class="progress-bar">
              <div id="completionBar" class="progress-fill"></div>
            </div>
          </div>

          <div class="pack-row">
            <button id="openBasicBtn" class="primary">Open Basic Pack</button>
            <button id="buyPackBtn" class="secondary">Buy Pack (10)</button>
            <button id="buyPremiumBtn" class="secondary">Buy Premium (18)</button>
          </div>

          <div id="packResults" class="pack-results"></div>
          <div id="toast" class="toast"></div>
        </div>

        <div class="sidebar">
          <div class="panel">
            <h3 style="margin:0 0 12px 0;">Shop</h3>
            <div class="shop-list">
              <div class="shop-item">
                <div>
                  <div class="shop-name">Basic Pack</div>
                  <div class="shop-desc">Standard odds</div>
                </div>
                <div class="shop-cost">10</div>
              </div>
              <div class="shop-item">
                <div>
                  <div class="shop-name">Premium Pack</div>
                  <div class="shop-desc">More rare cards</div>
                </div>
                <div class="shop-cost">18</div>
              </div>
              <div class="shop-item">
                <div>
                  <div class="shop-name">Legend Booster</div>
                  <div class="shop-desc">Higher legendary chance</div>
                </div>
                <div class="shop-cost">26</div>
              </div>
            </div>
          </div>

          <div class="panel">
            <h3 style="margin:0 0 12px 0;">Binder</h3>
            <div id="binderGrid" class="binder-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const TOTAL_CARDS = [
        { id: 1, name: 'Bulbasaur', type: 'Grass', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png' },
        { id: 2, name: 'Ivysaur', type: 'Grass', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/2.png' },
        { id: 3, name: 'Venusaur', type: 'Grass', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png' },
        { id: 4, name: 'Charmander', type: 'Fire', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png' },
        { id: 5, name: 'Charmeleon', type: 'Fire', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/5.png' },
        { id: 6, name: 'Charizard', type: 'Fire', rarity: 'Epic', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png' },
        { id: 7, name: 'Squirtle', type: 'Water', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png' },
        { id: 8, name: 'Wartortle', type: 'Water', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/8.png' },
        { id: 9, name: 'Blastoise', type: 'Water', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png' },
        { id: 10, name: 'Caterpie', type: 'Bug', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/10.png' },
        { id: 25, name: 'Pikachu', type: 'Electric', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png' },
        { id: 26, name: 'Raichu', type: 'Electric', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/26.png' },
        { id: 39, name: 'Jigglypuff', type: 'Fairy', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/39.png' },
        { id: 52, name: 'Meowth', type: 'Normal', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/52.png' },
        { id: 54, name: 'Psyduck', type: 'Water', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/54.png' },
        { id: 58, name: 'Growlithe', type: 'Fire', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/58.png' },
        { id: 59, name: 'Arcanine', type: 'Fire', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/59.png' },
        { id: 63, name: 'Abra', type: 'Psychic', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/63.png' },
        { id: 65, name: 'Alakazam', type: 'Psychic', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/65.png' },
        { id: 94, name: 'Gengar', type: 'Ghost', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png' },
        { id: 99, name: 'Kingler', type: 'Water', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/99.png' },
        { id: 113, name: 'Chansey', type: 'Normal', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/113.png' },
        { id: 120, name: 'Staryu', type: 'Water', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/120.png' },
        { id: 121, name: 'Starmie', type: 'Water', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/121.png' },
        { id: 133, name: 'Eevee', type: 'Normal', rarity: 'Common', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png' },
        { id: 134, name: 'Vaporeon', type: 'Water', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/134.png' },
        { id: 135, name: 'Jolteon', type: 'Electric', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/135.png' },
        { id: 136, name: 'Flareon', type: 'Fire', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/136.png' },
        { id: 144, name: 'Articuno', type: 'Ice', rarity: 'Legendary', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/144.png' },
        { id: 145, name: 'Zapdos', type: 'Electric', rarity: 'Legendary', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/145.png' },
        { id: 146, name: 'Moltres', type: 'Fire', rarity: 'Legendary', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/146.png' },
        { id: 150, name: 'Mewtwo', type: 'Psychic', rarity: 'Legendary', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png' },
        { id: 151, name: 'Mew', type: 'Psychic', rarity: 'Epic', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/151.png' },
        { id: 196, name: 'Espeon', type: 'Psychic', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/196.png' },
        { id: 214, name: 'Heracross', type: 'Bug', rarity: 'Rare', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/214.png' },
        { id: 248, name: 'Tyranitar', type: 'Rock', rarity: 'Epic', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/248.png' },
        { id: 384, name: 'Rayquaza', type: 'Dragon', rarity: 'Legendary', art: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/384.png' }
      ];

      const state = {
        coins: 25,
        packs: 0,
        collection: {},
        packsOpened: 0,
        lastOpenedPack: []
      };

      const coinsDisplay = document.getElementById('coinsDisplay');
      const packsDisplay = document.getElementById('packsDisplay');
      const collectionStat = document.getElementById('collectionStat');
      const uniqueStat = document.getElementById('uniqueStat');
      const duplicateStat = document.getElementById('duplicateStat');
      const packStat = document.getElementById('packStat');
      const completionPercent = document.getElementById('completionPercent');
      const completionBar = document.getElementById('completionBar');
      const packResults = document.getElementById('packResults');
      const binderGrid = document.getElementById('binderGrid');
      const toast = document.getElementById('toast');

      function getRarityColor(rarity) {
        if (rarity === 'Common') return '#dbeafe';
        if (rarity === 'Rare') return '#93c5fd';
        if (rarity === 'Epic') return '#c4b5fd';
        return '#f9a8d4';
      }

      function saveState() {
        localStorage.setItem('pokemonPocketState', JSON.stringify(state));
      }

      function loadState() {
        const saved = localStorage.getItem('pokemonPocketState');
        if (!saved) return;
        try {
          const parsed = JSON.parse(saved);
          Object.assign(state, parsed);
        } catch (err) {
          console.warn('Could not load saved state', err);
        }
      }

      function getTotalOwned() {
        return Object.values(state.collection).reduce((sum, count) => sum + count, 0);
      }

      function getUniqueOwned() {
        return Object.keys(state.collection).length;
      }

      function getDuplicates() {
        return getTotalOwned() - getUniqueOwned();
      }

      function updateStats() {
        const unique = getUniqueOwned();
        const total = TOTAL_CARDS.length;
        const completion = total === 0 ? 0 : (unique / total) * 100;

        coinsDisplay.textContent = String(state.coins);
        packsDisplay.textContent = String(state.packs);
        collectionStat.textContent = `${unique}/${total}`;
        uniqueStat.textContent = String(unique);
        duplicateStat.textContent = String(getDuplicates());
        packStat.textContent = String(state.packsOpened);
        completionPercent.textContent = `${Math.round(completion)}%`;
        completionBar.style.width = `${completion}%`;
      }

      function renderPackResults(cards) {
        packResults.innerHTML = '';

        cards.forEach((card) => {
          const cardEl = document.createElement('div');
          cardEl.className = 'pack-card';
          cardEl.style.borderColor = getRarityColor(card.rarity);

          cardEl.innerHTML = `
            <div class="card-rarity-tag" style="background:${getRarityColor(card.rarity)}; color:#111827;">${card.rarity}</div>
            <img class="card-art" src="${card.art}" alt="${card.name}" />
            <div class="card-name">${card.name}</div>
            <div class="card-type">${card.type}</div>
          `;

          packResults.appendChild(cardEl);
        });
      }

      function renderBinder() {
        binderGrid.innerHTML = '';

        TOTAL_CARDS.forEach((card) => {
          const count = state.collection[card.name] || 0;
          const item = document.createElement('div');
          item.className = `binder-card ${count > 0 ? 'owned' : ''}`;
          item.innerHTML = `
            <img class="mini-art" src="${card.art}" alt="${card.name}" />
            <div class="mini-name">${card.name}</div>
            <div class="mini-count">${count > 0 ? `${count}x` : 'Missing'}</div>
          `;
          binderGrid.appendChild(item);
        });
      }

      function setToast(message) {
        toast.textContent = message;
      }

      function selectCardByRarity(rarity) {
        const pool = TOTAL_CARDS.filter((card) => card.rarity === rarity);
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function drawPack(mode = 'basic') {
        const packSize = 5;
        const pulled = [];

        for (let i = 0; i < packSize; i++) {
          let card;

          if (mode === 'basic') {
            const roll = Math.random();
            if (roll < 0.62) card = selectCardByRarity('Common');
            else if (roll < 0.88) card = selectCardByRarity('Rare');
            else if (roll < 0.97) card = selectCardByRarity('Epic');
            else card = selectCardByRarity('Legendary');
          } else if (mode === 'premium') {
            const roll = Math.random();
            if (roll < 0.42) card = selectCardByRarity('Common');
            else if (roll < 0.82) card = selectCardByRarity('Rare');
            else if (roll < 0.96) card = selectCardByRarity('Epic');
            else card = selectCardByRarity('Legendary');
          } else {
            const roll = Math.random();
            if (roll < 0.18) card = selectCardByRarity('Common');
            else if (roll < 0.55) card = selectCardByRarity('Rare');
            else if (roll < 0.85) card = selectCardByRarity('Epic');
            else card = selectCardByRarity('Legendary');
          }

          pulled.push(card);
          state.collection[card.name] = (state.collection[card.name] || 0) + 1;
        }

        state.packsOpened += 1;
        state.lastOpenedPack = pulled;
        renderPackResults(pulled);
        renderBinder();
        updateStats();
        saveState();
      }

      function openBasicPack() {
        if (state.coins < 10) {
          setToast('Not enough coins for a pack!');
          return;
        }

        state.coins -= 10;
        state.packs += 1;
        drawPack('basic');
        setToast('You opened a Basic Pack!');
      }

      function buyPack() {
        if (state.coins < 10) {
          setToast('You need 10 coins to buy a pack.');
          return;
        }

        state.coins -= 10;
        state.packs += 1;
        drawPack('basic');
        setToast('Basic Pack purchased!');
      }

      function buyPremiumPack() {
        if (state.coins < 18) {
          setToast('You need 18 coins for a Premium Pack.');
          return;
        }

        state.coins -= 18;
        state.packs += 1;
        drawPack('premium');
        setToast('Premium Pack opened!');
      }

      function addDailyCoins() {
        state.coins += 8;
        setToast('Daily bonus collected: +8 coins!');
        updateStats();
        saveState();
      }

      document.getElementById('openBasicBtn').addEventListener('click', openBasicPack);
      document.getElementById('buyPackBtn').addEventListener('click', buyPack);
      document.getElementById('buyPremiumBtn').addEventListener('click', buyPremiumPack);

      window.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'd') {
          addDailyCoins();
        }
      });

      function init() {
        loadState();
        renderBinder();
        updateStats();

        if (state.lastOpenedPack.length) {
          renderPackResults(state.lastOpenedPack);
        }

        setToast('Welcome to Pokémon Pocket! Open packs and complete your binder!');
      }

      init();
    </script>
  </body>
</html>
